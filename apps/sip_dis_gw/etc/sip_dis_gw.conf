# SIP to DIS radio gateway (sip_dis_gw)
#
# A SIP call to sip:<radio>@<sems> becomes a DIS 7 radio on that radio's
# frequency. See Readme.sip_dis_gw.txt.

# DIS network
# ===========

# broadcast, multicast or unicast
dis_mode=broadcast

# where PDUs are sent: the broadcast address, the multicast group or the
# peer for unicast (defaults: 255.255.255.255, 239.1.2.3, 127.0.0.1)
#dis_address=255.255.255.255

# DIS port, used for sending and receiving
dis_port=3000

# local IPv4 address of the interface to use for multicast (optional)
#dis_interface=192.168.1.10

#dis_multicast_ttl=16
#dis_multicast_loop=yes

# DIS identity of the gateway: exercise and the entity its radios belong to.
# PDUs carrying the gateway's own site and application are ignored.
dis_exercise_id=1
dis_site_id=1
dis_application_id=200
dis_entity_id=1

# set the absolute bit in DIS timestamps (only if the clock is NTP synced)
#dis_absolute_timestamps=no

# Radios
# ======

# radio_<name>=<frequency>; a call to sip:<name>@<sems> uses that radio.
# Frequencies are in Hz, or with a kHz / MHz suffix.
radio_tower=118.1MHz
radio_ground=121.9MHz
radio_guard=121.5MHz

# also accept a dialled frequency: digits in kHz (sip:118100@...) or a
# decimal number in MHz (sip:118.100@...)
allow_dialed_frequency=yes

# Signals of transmitters within this distance of a radio's frequency are
# heard on it (Hz or with suffix, 0 for an exact match)
#frequency_tolerance=500

# Transmitter PDU contents
# ========================

# radio entity type: kind.domain.country.category.nomenclature_version.nomenclature
#radio_entity_type=7.0.0.0.0.0

# modulation: spread_spectrum.major.detail.system (default: AM, generic radio)
#modulation=0.1.2.1

#input_source=0
#transmit_bandwidth=25kHz
# dBm
#transmit_power=40

# antenna position (WGS-84 degrees, metres)
#antenna_latitude=0
#antenna_longitude=0
#antenna_altitude=0

# Audio
# =====

# encoding of sent Signal PDUs: mulaw, pcm16be or pcm16le (all are decoded,
# as is 8 bit unsigned PCM); always 8 kHz
#encoding=mulaw

# audio per Signal PDU (10..100 ms)
#signal_frame_ms=20

# playout buffer per received transmitter: audio is played once this much
# is queued; latency is capped at jitter_max_ms (not below the prebuffer)
#jitter_prebuffer_ms=60
#jitter_max_ms=400

# callers on the same frequency hear each other
#local_loop=yes

# Push-to-talk
# ============

# vox:    transmit while the caller speaks (voice activation)
# dtmf:   '*' keys the radio, '#' unkeys it
# always: transmit for the whole call
# listen: never transmit
ptt_mode=vox

# voice activation: threshold, hold time after speech ends and how much
# audio from before the radio keyed is sent along
#vox_threshold_dbfs=-40
#vox_hang_ms=600
#vox_preroll_ms=40

# dtmf mode: unkey after this long (0: never)
#ptt_max_ms=60000

# Timing
# ======

#transmitter_heartbeat_ms=2000
#receiver_heartbeat_ms=5000
# forget remote transmitters not heard from for this long
#remote_transmitter_timeout_ms=4800
# unkey when the caller's audio stops for this long
#tx_idle_ms=1000

# Optional PDUs
# =============

# Receiver PDUs for every radio
#publish_receiver=yes

# an Entity State PDU for the gateway entity, at the antenna position
#publish_entity_state=no
#entity_heartbeat_ms=5000
# kind.domain.country.category.subcategory.specific.extra
#entity_type=0.0.0.0.0.0.0
#entity_force_id=0
#entity_marking=SEMS-GW
