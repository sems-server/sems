# DIS Integration Test Module Configuration
# 
# This module generates a sinus wave and sends OpenDIS-encoded
# EntityStatePDU packets to a DIS gateway for integration testing.

# DIS Configuration
# =================

# Multicast mode (true) or unicast to gateway (false)
dis_multicast_mode=true

# Multicast address (if dis_multicast_mode=true)
# Standard DIS multicast: 224.0.0.1
dis_multicast_addr=224.0.0.1

# Direct gateway address (if dis_multicast_mode=false)
# Point to your DIS gateway IP
dis_gateway_addr=127.0.0.1

# DIS gateway port (standard: 3000)
dis_gateway_port=3000

# Audio Configuration
# ===================

# Sinus wave frequency (Hz) - common test: 400Hz (military radio test tone)
sinus_frequency=400

# Sinus amplitude (0.0-1.0)
sinus_amplitude=0.5

# DIS sender interval in milliseconds (range 20..5000)
dis_send_interval_ms=100

# DIS entity and PDU settings
dis_exercise_id=1
dis_site_id=1
dis_application_id=200
dis_entity_id=1
dis_force_id=1
dis_entity_country=840
dis_entity_category=50
